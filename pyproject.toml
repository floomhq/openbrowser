[project]
name = "openbrowser-broker"
version = "0.1.0"
description = "Open-source browser automation broker with persistent Chrome profiles, proxy-aware identities, remote API, and MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
  "browser automation",
  "mcp",
  "openbrowser",
  "browser-use",
  "playwright",
  "chrome cdp",
  "ai agents",
  "persistent browser profiles",
  "proxy browser",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn>=0.39.0",
  "playwright>=1.50.0",
  "websockets>=16.0",
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/federicodeponte/ax-browser-broker"
Documentation = "https://github.com/federicodeponte/ax-browser-broker#readme"
Issues = "https://github.com/federicodeponte/ax-browser-broker/issues"

[project.scripts]
openbrowser-broker = "ax_browser_broker.api:main"
openbrowser-mcp = "ax_browser_broker.mcp_server:main"
openbrowser-remote-mcp = "ax_browser_broker.remote_mcp_server:main"
openbrowser-audit = "ax_browser_broker.audit:main"
openbrowser-use = "ax_browser_broker.adapters:main_browser_use"
openbrowser-adapter = "ax_browser_broker.adapters:main_openbrowser"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["ax_browser_broker*"]
