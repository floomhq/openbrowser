name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile
        run: python -m compileall ax_browser_broker tests
      - name: Test
        run: pytest -q
      - name: Secret-state guard
        run: |
          ! git ls-files | grep -E '^(secrets|state|profiles|logs|artifacts|config/identities.local.json)/?'
